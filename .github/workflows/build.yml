name: Build USL ACSII

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # `npm run build` triggers the "prebuild" hook, which downloads the manga panels
      # into assets/manga_bg/ before electron-builder bundles them.
      - name: Build Windows executables
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: USL-ACSII-portable
          path: dist/*-portable.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: USL-ACSII-installer
          path: dist/*-Setup-*.exe
          if-no-files-found: error
